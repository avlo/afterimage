services:
  afterimage-db_redis-dev_ws_6381:
    image: "redis:8.0.0"
    hostname: afterimage-db_redis-dev_ws_6381
    ports:
      - "6381:6379"
    networks:
      - superconductor_net
  afterimage-app-dev-ws-6381:
    image: afterimage-nostr-reputation-relay:1.3.1
    ports:
      - "5557:5556"
    depends_on:
      - afterimage-db_redis-dev_ws_6381
    networks:
      - superconductor_net
    environment:
      SPRING_PROFILES_ACTIVE: dev_ws
      SPRING_DATA_REDIS_HOST: afterimage-db_redis-dev_ws_6381
      AFTERIMAGE_RELAY_URL: "ws://afterimage-app-dev-ws-6381:5557"
volumes:
  afterimage-db_redis-dev_ws_6381:
    driver: local
networks:
  superconductor_net:
    external: true
    name: prosilion-net
