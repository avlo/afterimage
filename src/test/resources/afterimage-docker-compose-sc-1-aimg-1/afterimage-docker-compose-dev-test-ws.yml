services:
# ***********************
#  SC Redis 6379
# ***********************  
  superconductor-db:
    image: "redis:8.0.0"
    hostname: superconductor-db
    ports:
      - "6379:6379"
    networks:
      - afterimage_net
    healthcheck:
      test: [ "CMD", "redis-cli" ,"ping", "superconductor-db" ]
      retries: 3
      interval: 1s
      timeout: 2s
#  SC App 5555
  superconductor-afterimage:
    image: superconductor-app-redis:1.19.0
    ports:
      - "5555:5555"
    depends_on:
      superconductor-db:
        condition: service_healthy
    networks:
      - afterimage_net
#    extra_hosts:
#      - "host.docker.internal:host-gateway"   # reach the host machine (Linux)  
    environment:
      SPRING_PROFILES_ACTIVE: dev_ws
      SUPERCONDUCTOR_RELAY_URL: ws://superconductor-afterimage:5555
      SUPERCONDUCTOR_KEY_PRIVATE: fa11661b5f43c8f18f11861b4d553c47337dac9e351083b27320e311b7b324ac
      SUPERCONDUCTOR_KEY_PUBLIC: e04e1c1c30df6058433f61681644fd24914f2e02e420496086c61f53eb504c04
      LOGGING_LEVEL_COM_PROSILION_SUPERCONDUCTOR_BASE_CONTROLLER: debug
      LOGGING_LEVEL_COM_PROSILION_SUPERCONDUCTOR_BASE_SERVICE_EVENT: debug
      SPRING_DATA_REDIS_HOST: superconductor-db
      SUPERCONDUCTOR_TIMEOUT_DURATION: 5
      SUPERCONDUCTOR_TIMEOUT_UNITS: SECONDS
      SPRING_THREADS_VIRTUAL_ENABLED: true
# ***********************
#   aImg App-2 Redis 6381 (docker container)
# ***********************  
  afterimage-db-two:
    image: "redis:8.0.0"
    hostname: afterimage-db-two
    ports:
      - "6381:6379"
    networks:
      - afterimage_net
    healthcheck:
      test: [ "CMD", "redis-cli" ,"ping", "afterimage-db-two" ]
      retries: 3
      interval: 1s
      timeout: 2s
# aImg App2 5557 (docker container)
  afterimage-app-two:
    image: afterimage-nostr-reputation-relay:1.4.0
    ports:
      - "5557:5556"
    depends_on:
      afterimage-db-two:
        condition: service_healthy
    networks:
      afterimage_net:
        ipv4_address: 172.19.0.5
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the host machine (Linux)
    environment:
      SPRING_PROFILES_ACTIVE: dev_ws
      SUPERCONDUCTOR_EVENT_CURATION_ACTIVE: true
#
      SUPERCONDUCTOR_RELAY_URL: ws://172.19.0.5:5556
#      SUPERCONDUCTOR_RELAY_URL: ws://afterimage-app-two:5556
#      SUPERCONDUCTOR_RELAY_URL: ws://localhost:5557
#      
      AFTERIMAGE_RELAY_URL: ws://172.19.0.5:5556
#      AFTERIMAGE_RELAY_URL: ws://afterimage-app-two:5556
#      AFTERIMAGE_RELAY_URL: ws://localhost:5557
#        
      SUPERCONDUCTOR_KEY_PRIVATE: fa11661b5f43c8f18f11861b4d553c47337dac9e351083b27320e311b7b324ac
      SUPERCONDUCTOR_KEY_PUBLIC: e04e1c1c30df6058433f61681644fd24914f2e02e420496086c61f53eb504c04
#      LOGGING_LEVEL_COM_PROSILION_SUPERCONDUCTOR_BASE: debug
#      LOGGING_LEVEL_COM_PROSILION_SUPERCONDUCTOR_AUTOCONFIGURE: debug
      LOGGING_LEVEL_COM_PROSILION_SUPERCONDUCTOR_BASE_CONTROLLER: debug
      LOGGING_LEVEL_COM_PROSILION_SUPERCONDUCTOR_AUTOCONFIGURE_BASE_SERVICE_EVENT_TAG: info
      LOGGING_LEVEL_COM_PROSILION_SUPERCONDUCTOR_AUTOCONFIGURE_CURATION_PLUGIN: info
      LOGGING_LEVEL_COM_PROSILION_SUPERCONDUCTOR_AUTOCONFIGURE_CURATION_SERVICE_EVENT: info
      LOGGING_LEVEL_COM_PROSILION_SUPERCONDUCTOR_BASE_SERVICE_EVENT: info
      LOGGING_LEVEL_COM_PROSILION_AFTERIMAGE_SERVICE_REQUEST: info      
      SPRING_DATA_REDIS_HOST: afterimage-db-two
      SUPERCONDUCTOR_TIMEOUT_DURATION: 5
      SUPERCONDUCTOR_TIMEOUT_UNITS: SECONDS
      SPRING_THREADS_VIRTUAL_ENABLED: true
#
volumes:
  superconductor-db:
    driver: local
  afterimage-db-two:
    driver: local
networks:
  afterimage_net:
#    external: true
#    name: prosilion-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
#    driver_opts:
#      com.docker.network.bridge.name: prosilion-net      
#      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
